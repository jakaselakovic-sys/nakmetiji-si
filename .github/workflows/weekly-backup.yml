name: Tedenski izvoz baze

on:
  schedule:
    # Vsak ponedeljek ob 3:00 zjutraj
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  db-export:
    name: Izvozi bazo podatkov
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Poženi izvoz baze
        run: node scripts/db-export.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Shrani izvoz (90 dni)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/
          retention-days: 90

      - name: Preveri velikost izvoza
        run: |
          echo "=== Ustvarjene datoteke ==="
          ls -lh exports/
          echo "=== Skupna velikost ==="
          du -sh exports/

      - name: Alert če izvoz ni uspel
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Tedenski izvoz baze NEUSPEŠEN',
              body: `Avtomatski izvoz baze podatkov ni uspel.\n\n**Čas:** ${new Date().toISOString()}\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPreveri Supabase credentials in logs.`,
              labels: ['backup-failed']
            });
